# Agent 1 — n8n deployment stack
# Brings up n8n behind Caddy (automatic HTTPS) on the VPS. Zoom and Calendly webhooks
# require a valid public TLS endpoint, which Caddy provides.
#
# Quick start:
#   1. Point a DNS A record (e.g. n8n.fedgovstartup.com) at this VPS's IP.
#   2. cp .env.example .env  and fill in the values.
#   3. docker compose up -d
#   4. Open https://n8n.<domain>, create the owner account, then import the 3 workflows
#      from ../wf*.json and create the credentials (RUNBOOK §9).

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    restart: unless-stopped
    environment:
      - N8N_HOST=${N8N_HOST}
      - N8N_PROTOCOL=https
      - N8N_PORT=5678
      - WEBHOOK_URL=https://${N8N_HOST}/
      - GENERIC_TIMEZONE=America/New_York
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      # Basic auth on the editor UI (set in .env)
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD}
      # Passed through to the HTTP Request nodes in the workflows
      - GHL_LOCATION_ID=${GHL_LOCATION_ID}
      - ZOOM_ACCOUNT_ID=${ZOOM_ACCOUNT_ID}
      - ZOOM_WEBHOOK_SECRET_TOKEN=${ZOOM_WEBHOOK_SECRET_TOKEN}
    volumes:
      - n8n_data:/home/node/.n8n
    expose:
      - "5678"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - n8n

volumes:
  n8n_data:
  caddy_data:
  caddy_config:
